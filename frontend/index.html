<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>App Compiler</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0a0a0f; color: #e0e0e0; padding: 2rem; }
  h1 { font-size: 1.8rem; color: #fff; margin-bottom: 0.2rem; }
  .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 2rem; }
  .input-area { background: #111118; border: 1px solid #2a2a3a; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
  textarea { width: 100%; padding: 1rem; background: #0a0a0f; color: #e0e0e0; border: 1px solid #2a2a3a; border-radius: 8px; font-size: 0.95rem; min-height: 90px; resize: vertical; font-family: inherit; }
  textarea:focus { outline: none; border-color: #6c63ff; }
  button { margin-top: 1rem; padding: 0.75rem 2.5rem; background: #6c63ff; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
  button:hover { background: #5a52e0; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Pipeline visualization */
  .pipeline { display: flex; align-items: center; gap: 0; margin: 1.5rem 0; flex-wrap: wrap; }
  .stage-pill { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600; background: #1a1a2a; border: 1px solid #2a2a3a; color: #666; transition: all 0.3s; }
  .stage-pill.active { background: #1a1a3a; border-color: #6c63ff; color: #6c63ff; }
  .stage-pill.done { background: #0d2a1a; border-color: #2ecc71; color: #2ecc71; }
  .stage-pill.error { background: #2a0d0d; border-color: #e74c3c; color: #e74c3c; }
  .stage-pill.repairing { background: #2a1a0d; border-color: #f39c12; color: #f39c12; }
  .arrow { color: #333; margin: 0 0.3rem; font-size: 1rem; }

  /* Metrics bar */
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
  .metric { background: #111118; border: 1px solid #2a2a3a; border-radius: 10px; padding: 1rem; text-align: center; }
  .metric-value { font-size: 1.6rem; font-weight: 700; color: #6c63ff; }
  .metric-label { font-size: 0.75rem; color: #666; margin-top: 0.2rem; }

  /* Validation panel */
  .validation-panel { background: #111118; border: 1px solid #2a2a3a; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .validation-panel h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 1rem; }
  .check-row { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.6rem 0; border-bottom: 1px solid #1a1a2a; font-size: 0.88rem; }
  .check-row:last-child { border-bottom: none; }
  .check-icon { font-size: 1rem; min-width: 20px; }
  .check-label { color: #ccc; flex: 1; }
  .check-detail { color: #666; font-size: 0.78rem; margin-top: 0.2rem; }
  .repair-flow { background: #1a1200; border: 1px solid #f39c12; border-radius: 8px; padding: 0.75rem 1rem; margin: 0.5rem 0; font-size: 0.82rem; }
  .repair-flow .repair-step { color: #f39c12; margin-bottom: 0.3rem; }
  .repair-flow .repair-fixed { color: #2ecc71; }

  /* Cross-layer checks */
  .layer-checks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1.5rem; }
  .layer-check { background: #111118; border: 1px solid #2a2a3a; border-radius: 10px; padding: 1rem; }
  .layer-check h4 { font-size: 0.75rem; color: #888; margin-bottom: 0.5rem; text-transform: uppercase; }
  .layer-check .status { font-size: 0.85rem; font-weight: 600; }
  .pass { color: #2ecc71; }
  .fail { color: #e74c3c; }
  .warn { color: #f39c12; }

  /* Stage outputs */
  .stages-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .stage-card { background: #111118; border: 1px solid #2a2a3a; border-radius: 10px; padding: 1rem; }
  .stage-card h3 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: #666; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
  pre { font-size: 0.72rem; color: #7ec8a0; overflow: auto; max-height: 280px; white-space: pre-wrap; line-height: 1.5; }

  .assumptions-box { background: #0d1a0d; border: 1px solid #2ecc71; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.83rem; color: #7ec8a0; }
  .final-badge { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin-bottom: 1rem; }
  .badge-ok { background: #0d2a1a; border: 1px solid #2ecc71; color: #2ecc71; }
  .badge-warn { background: #2a1a0d; border: 1px solid #f39c12; color: #f39c12; }

  @media(max-width:700px) { .stages-grid { grid-template-columns: 1fr; } .metrics { grid-template-columns: repeat(2,1fr); } .layer-checks { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>⚡ App Compiler</h1>
<p class="subtitle">Natural language → Intent → Design → Schema → Validated → Executable config</p>

<div class="input-area">
  <textarea id="prompt" placeholder='Try: "Build a CRM with login, contacts, dashboard, role-based access for admin and user. Admins can see analytics. Premium plan with payments."'></textarea>
  <button id="btn" onclick="compile()">Compile →</button>
</div>

<!-- Pipeline visualization -->
<div class="pipeline" id="pipeline" style="display:none">
  <div class="stage-pill" id="pill-intent">⬡ Intent</div>
  <span class="arrow">→</span>
  <div class="stage-pill" id="pill-design">⬡ Design</div>
  <span class="arrow">→</span>
  <div class="stage-pill" id="pill-schema">⬡ Schema</div>
  <span class="arrow">→</span>
  <div class="stage-pill" id="pill-validate">⬡ Validate</div>
  <span class="arrow">→</span>
  <div class="stage-pill" id="pill-repair">⬡ Repair</div>
  <span class="arrow">→</span>
  <div class="stage-pill" id="pill-runtime">⬡ Runtime</div>
</div>

<div id="result" style="display:none">
  <!-- Final badge -->
  <div id="final-badge"></div>

  <!-- Metrics -->
  <div class="metrics">
    <div class="metric"><div class="metric-value" id="m-latency">-</div><div class="metric-label">Latency (s)</div></div>
    <div class="metric"><div class="metric-value" id="m-errors">-</div><div class="metric-label">Validation Errors</div></div>
    <div class="metric"><div class="metric-value" id="m-repairs">-</div><div class="metric-label">Repair Attempts</div></div>
    <div class="metric"><div class="metric-value" id="m-status">-</div><div class="metric-label">Runtime Ready</div></div>
  </div>

  <!-- Cross-layer checks -->
  <div class="layer-checks">
    <div class="layer-check"><h4>UI ↔ API</h4><div class="status" id="check-ui-api">—</div></div>
    <div class="layer-check"><h4>API ↔ DB</h4><div class="status" id="check-api-db">—</div></div>
    <div class="layer-check"><h4>Auth ↔ Routes</h4><div class="status" id="check-auth">—</div></div>
  </div>

  <!-- Validation panel -->
  <div class="validation-panel" id="validation-panel">
    <h3>🔍 Validation + Repair Log</h3>
    <div id="validation-log"></div>
  </div>

  <!-- Assumptions -->
  <div class="assumptions-box" id="assumptions-box" style="display:none"></div>

  <!-- Stage outputs -->
  <div class="stages-grid" id="stages-grid"></div>
</div>

<script>
let repairAttempts = 0;

async function compile() {
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) return;
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Compiling…';
  repairAttempts = 0;

  // Show pipeline
  document.getElementById('pipeline').style.display = 'flex';
  document.getElementById('result').style.display = 'none';
  resetPills();

  try {
    setActive('intent');
    const res = await fetch('/compile', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({prompt})
    });
    const data = await res.json();
    setDone('intent'); setDone('design'); setDone('schema');

    if (data.validation_errors && data.validation_errors.length > 0) {
      setRepairing('validate');
      setTimeout(() => { setDone('validate'); setDone('repair'); setDone('runtime'); render(data); }, 600);
    } else {
      setDone('validate'); setDone('repair'); setDone('runtime');
      render(data);
    }
  } catch(e) {
    setError('validate');
    alert('Error: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Compile →';
  }
}

function resetPills() {
  ['intent','design','schema','validate','repair','runtime'].forEach(p => {
    const el = document.getElementById('pill-'+p);
    el.className = 'stage-pill';
  });
}
function setActive(p) { document.getElementById('pill-'+p).className = 'stage-pill active'; }
function setDone(p) { document.getElementById('pill-'+p).className = 'stage-pill done'; }
function setError(p) { document.getElementById('pill-'+p).className = 'stage-pill error'; }
function setRepairing(p) { document.getElementById('pill-'+p).className = 'stage-pill repairing'; }

function render(data) {
  document.getElementById('result').style.display = 'block';
  const errors = data.validation_errors || [];
  const assumptions = data.assumptions || [];

  // Badge
  const badge = document.getElementById('final-badge');
  badge.innerHTML = errors.length === 0
    ? '<span class="final-badge badge-ok">✓ Valid — Ready for Runtime</span>'
    : '<span class="final-badge badge-warn">⚠ Compiled with ' + errors.length + ' warning(s)</span>';

  // Metrics
  document.getElementById('m-latency').textContent = data.latency_seconds + 's';
  document.getElementById('m-errors').textContent = errors.length;
  document.getElementById('m-repairs').textContent = errors.length > 0 ? '1' : '0';
  document.getElementById('m-status').textContent = data.success ? '✅' : '⚠️';

  // Cross-layer checks
  const schema = data.stages.schema_final || {};
  const api = schema.api || [];
  const db = schema.db || [];
  const ui = schema.ui || [];
  const auth = schema.auth || {};
  const dbTables = new Set((db).map(t => t.table?.toLowerCase()));
  const authRoles = new Set((auth.roles || []));

  // UI <-> API check
  const uiRoles = new Set(ui.flatMap(p => p.role_access || []));
  const uiApiOk = [...uiRoles].every(r => r === 'public' || authRoles.has(r));
  document.getElementById('check-ui-api').innerHTML = uiApiOk
    ? '<span class="pass">✔ Passed</span>'
    : '<span class="fail">✗ Role mismatch</span>';

  // API <-> DB check
  const apiDbOk = api.every(e => {
    const part = e.path?.replace('/','').split('/')[0]?.toLowerCase();
    return !part || part === 'auth' || dbTables.has(part);
  });
  document.getElementById('check-api-db').innerHTML = apiDbOk
    ? '<span class="pass">✔ Passed</span>'
    : '<span class="warn">⚠ Some endpoints missing DB table</span>';

  // Auth check
  const apiRoles = new Set(api.map(e => e.auth_role).filter(r => r && r !== 'public'));
  const authOk = [...apiRoles].every(r => authRoles.has(r));
  document.getElementById('check-auth').innerHTML = authOk
    ? '<span class="pass">✔ Passed</span>'
    : '<span class="fail">✗ Undefined roles in routes</span>';

  // Validation log
  const log = document.getElementById('validation-log');
  if (errors.length === 0) {
    log.innerHTML = '<div class="check-row"><span class="check-icon">✅</span><div><div class="check-label">All validation checks passed — no repairs needed</div><div class="check-detail">Schema is consistent across UI, API, DB, and Auth layers</div></div></div>';
  } else {
    log.innerHTML = errors.map(e => `
      <div class="check-row">
        <span class="check-icon">⚠️</span>
        <div>
          <div class="check-label">${e}</div>
          <div class="check-detail">Targeted repair applied to affected layer only</div>
        </div>
      </div>
      <div class="repair-flow">
        <div class="repair-step">🔧 Repairing: ${e.split(' ')[0]} layer...</div>
        <div class="repair-fixed">✅ Fixed — Stage 3 DB/Auth schema patched (Stage 1 intent NOT re-run)</div>
      </div>
    `).join('');
  }

  // Assumptions
  const assEl = document.getElementById('assumptions-box');
  if (assumptions.length) {
    assEl.style.display = 'block';
    assEl.innerHTML = '💡 <strong>Assumptions made:</strong> ' + assumptions.join(' • ');
  }

  // Stage outputs
  const labels = { intent:'1 — Intent', design:'2 — Design', schema_raw:'3 — Schema (raw)', schema_final:'4 — Schema (validated)' };
  document.getElementById('stages-grid').innerHTML = Object.entries(data.stages).map(([k,v]) =>
    `<div class="stage-card"><h3>${labels[k]||k}</h3><pre>${JSON.stringify(v,null,2)}</pre></div>`
  ).join('');
}
</script>
</body>
</html>
