<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>App Compiler</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #0f0f0f; color: #e0e0e0; padding: 2rem; }
  h1 { font-size: 1.6rem; margin-bottom: 0.3rem; color: #fff; }
  p.sub { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
  textarea { width: 100%; padding: 1rem; background: #1a1a1a; color: #e0e0e0;
    border: 1px solid #333; border-radius: 8px; font-size: 1rem;
    min-height: 100px; resize: vertical; }
  button { margin-top: 0.8rem; padding: 0.7rem 2rem; background: #6c63ff;
    color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .stages { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem; }
  .stage { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 1rem; }
  .stage h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: #888; margin-bottom: 0.5rem; }
  pre { font-size: 0.75rem; color: #b0ffb0; overflow: auto; max-height: 320px; white-space: pre-wrap; }
  .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 4px;
    font-size: 0.75rem; font-weight: 600; margin-bottom: 1rem; }
  .ok { background: #1a3a1a; color: #4caf50; }
  .err { background: #3a1a1a; color: #f44336; }
  .meta { color: #888; font-size: 0.85rem; margin-bottom: 0.5rem; }
  .error-box { background: #2a1a1a; border: 1px solid #f44336;
    border-radius: 6px; padding: 0.7rem; margin-top: 0.5rem; font-size: 0.8rem; color: #f99; }
  .assumptions { background: #1a2a1a; border: 1px solid #4caf50;
    border-radius: 6px; padding: 0.7rem; margin-top: 0.5rem; font-size: 0.8rem; color: #b0ffb0; }
  @media(max-width:700px) { .stages { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>App Compiler</h1>
<p class="sub">Natural language → validated app config in 4 stages</p>

<textarea id="prompt" placeholder='Try: "Build a CRM with login, contacts, dashboard, role-based access for admin and user. Admins can see analytics. Premium plan with payments."'></textarea>
<button id="btn" onclick="compile()">Compile →</button>

<div id="result" style="display:none; margin-top:1.5rem">
  <div id="status" class="badge"></div>
  <div class="meta" id="meta"></div>
  <div id="assumptions" class="assumptions" style="display:none"></div>
  <div id="errors" class="error-box" style="display:none"></div>
  <div class="stages" id="stages"></div>
</div>

<script>
async function compile() {
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) return;
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = 'Compiling…';
  document.getElementById('result').style.display = 'none';

  try {
    const res = await fetch('/compile', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({prompt})
    });
    const data = await res.json();
    render(data);
  } catch(e) {
    alert('Error: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Compile →';
  }
}

function render(data) {
  document.getElementById('result').style.display = 'block';
  const status = document.getElementById('status');
  status.textContent = data.success ? '✓ Valid — ready for runtime' : '⚠ Compiled with warnings';
  status.className = 'badge ' + (data.success ? 'ok' : 'err');
  document.getElementById('meta').textContent = `Latency: ${data.latency_seconds}s`;

  const ass = data.assumptions || [];
  const assEl = document.getElementById('assumptions');
  if (ass.length) {
    assEl.style.display = 'block';
    assEl.innerHTML = '<strong>Assumptions made:</strong><ul style="margin:.4rem 0 0 1rem">' +
      ass.map(a => `<li>${a}</li>`).join('') + '</ul>';
  }

  const errs = data.validation_errors || [];
  const errEl = document.getElementById('errors');
  if (errs.length) {
    errEl.style.display = 'block';
    errEl.innerHTML = '<strong>Validation warnings:</strong><ul style="margin:.4rem 0 0 1rem">' +
      errs.map(e => `<li>${e}</li>`).join('') + '</ul>';
  }

  const stagesEl = document.getElementById('stages');
  const labels = {
    intent: '1 — Intent', design: '2 — Design',
    schema_raw: '3 — Schema (raw)', schema_final: '4 — Schema (validated)'
  };
  stagesEl.innerHTML = Object.entries(data.stages).map(([k, v]) =>
    `<div class="stage"><h3>${labels[k]||k}</h3><pre>${JSON.stringify(v, null, 2)}</pre></div>`
  ).join('');
}
</script>
</body>
</html>
